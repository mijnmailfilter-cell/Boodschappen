name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Firebase-config aanwezig?
        id: cfg
        run: |
          if [ -f app/google-services.json ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::app/google-services.json ontbreekt nog - build overgeslagen"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ondertekeningssleutel ontsleutelen
        if: steps.cfg.outputs.ok == 'true'
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Secret SIGNING_PASSWORD ontbreekt (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SIGNING_PASSWORD \
            -in app/boodschappie.keystore.enc -out app/boodschappie.keystore

      - name: Build
        if: steps.cfg.outputs.ok == 'true'
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: APK klaarzetten
        if: steps.cfg.outputs.ok == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk Boodschappie.apk

      - name: Release publiceren
        if: steps.cfg.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Boodschappie 1.0.${{ github.run_number }}
          files: Boodschappie.apk
          make_latest: true
