name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Firebase-config aanwezig?
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "::error::app/google-services.json ontbreekt (download uit Firebase)"
            exit 1
          fi

      - name: Build
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: APK klaarzetten
        run: cp app/build/outputs/apk/release/app-release.apk Boodschappie.apk

      - name: Release publiceren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Boodschappie 1.0.${{ github.run_number }}
          files: Boodschappie.apk
          make_latest: true
